<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#101f43">
  <meta name="description" content="A moonlit bicycle ride along a warm, colourful coast. Play the Unity edition in your browser.">
  <title>Moonlit Ride</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101f43;color:#fff3da;font:16px system-ui,sans-serif}
    #game{position:absolute;inset:0 0 32px}canvas{width:100%;height:100%;display:block;outline:none;touch-action:none}
    #loading{position:absolute;inset:0;display:grid;place-content:center;text-align:center;background:radial-gradient(ellipse at 65% 25%,#2e4b83,#101b36 75%);padding:24px}
    h1{font:400 clamp(36px,7vw,72px) Georgia,serif;margin:0 0 14px}p{color:#c8d7ef;max-width:480px;line-height:1.6}
    progress{width:100%;height:6px;accent-color:#ffd184}#error{color:#ffcfa8;white-space:pre-wrap}
    footer{position:absolute;bottom:0;height:32px;width:100%;display:flex;align-items:center;justify-content:space-between;padding:0 12px;font-size:12px;gap:12px}a,button{color:#e5d0a5}button{background:none;border:0;cursor:pointer;font:inherit}a{text-decoration:none}a:hover,button:hover{text-decoration:underline}
    [hidden]{display:none!important}
  </style>
</head>
<body>
  <main id="game">
    <canvas id="unity-canvas" tabindex="0" aria-label="Moonlit Ride game. WASD or arrow keys to ride, Space to pause, R to restart."></canvas>
    <section id="loading" aria-live="polite"><h1>Moonlit Ride</h1><p>A warm coast, a blue evening, and the road ahead.</p><progress id="progress" max="1" value="0" aria-label="Loading game"></progress><p id="status">Loading the coast…</p><p id="error" hidden></p></section>
  </main>
  <footer><span>Unity edition · <a href="THIRD_PARTY_ASSETS.md" target="_blank" rel="noopener">Asset credits</a> · <a href="classic/">Original edition</a></span><button id="fullscreen" hidden>Full screen</button></footer>
  <script src="moonlit-audio.js"></script>
  <script src="Build/09f38e39c0ea7be2cf8151fb1ee1a233.loader.js"></script>
  <script>
    const canvas = document.getElementById('unity-canvas');
    function fail(message) {
      document.getElementById('loading').hidden = false;
      document.getElementById('status').textContent = 'The game could not start. Try reloading in a desktop browser with WebGL 2 enabled.';
      document.getElementById('error').hidden = false;
      document.getElementById('error').textContent = String(message);
    }
    createUnityInstance(canvas, {
      dataUrl: 'Build/d757f39857f68df40e55a72496eed55b.data.unityweb',
      frameworkUrl: 'Build/41890cdcffe7894442384687b0fe3809.framework.js.unityweb',
      codeUrl: 'Build/55c3290259e03265dc1431a9a9056208.wasm.unityweb',
      streamingAssetsUrl: 'StreamingAssets',
      companyName: 'Moonlit Ride', productName: 'Moonlit Ride', productVersion: '1.0',
      devicePixelRatio: Math.min(window.devicePixelRatio || 1, 1.5),
      showBanner: (message, type) => { if (type === 'error') fail(message); else console.warn(message); }
    }, progress => {
      document.getElementById('progress').value = progress;
      document.getElementById('status').textContent = progress >= .9 ? 'Bringing the coast to life…' : 'Loading the coast… ' + Math.round(progress * 100) + '%';
    }).then(instance => {
      document.getElementById('loading').hidden = true;
      canvas.focus();
      const fullscreen = document.getElementById('fullscreen');
      fullscreen.hidden = false; fullscreen.onclick = () => instance.SetFullscreen(1);
      window.addEventListener('pagehide', () => window.moonlitAudio.dispose(), {once:true});
    }).catch(fail);
  </script>
</body>
</html>
